name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: yt_test
          POSTGRES_PASSWORD: yt_test
          POSTGRES_DB: yt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yt_test -d yt_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://yt_test:yt_test@127.0.0.1:5432/yt_test
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install FFmpeg and ffprobe
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Run unit and integration tests
        run: bun run test
