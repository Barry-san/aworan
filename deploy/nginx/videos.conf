# HLS playlists/segments served straight from disk.
# Install: copy into /etc/nginx/conf.d/ (or include from your server block),
# replace PATH_TO_YT with the project dir that contains the "videos" folder,
# then: nginx -t && nginx -s reload
#
# m3u8 -> application/vnd.apple.mpegurl and ts -> video/mp2t come from
# nginx's default mime.types; full "videos" is served with no-cache so HLS.js
# always sees the freshest playlist/segments.
location ~ ^/videos/[0-9a-f-]{36}/ {
    root /PATH_TO_YT;
    try_files $uri =404;
    add_header Cache-Control "no-cache";
}
